[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "premove-itn-data"
version = "0.1.0"
description = "Private dataset construction tools for premove-itn"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["premove-itn"]

[project.scripts]
premove-audit-google-tn = "premove_itn_data.google_tn.audit:main"
premove-audit-sgd = "premove_itn_data.enrichment.sgd_audit:main"
premove-write-enrichment-reservoir = "premove_itn_data.enrichment.reservoir:main"
premove-select-google-tn = "premove_itn_data.google_tn.select:main"
premove-write-google-tn-corpus = "premove_itn_data.google_tn.corpus:main"
premove-write-google-tn-shard = "premove_itn_data.google_tn.shard:main"

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.uv.sources]
premove-itn = { workspace = true }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/premove_itn_data"]
