[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "premove-itn"
version = "0.1.0"
description = "Deterministic inverse text normalization primitives for voice agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "premove-ai" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/premove-ai/premove-itn"
Issues = "https://github.com/premove-ai/premove-itn/issues"

[dependency-groups]
dev = ["maturin>=1,<2", "pytest>=8.3,<10", "ruff>=0.9,<1"]
model = [
  "safetensors>=0.4,<1",
  "torch==2.13.0",
  "transformers[sentencepiece]==5.16.1",
]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "premove_itn._rust"
features = ["extension-module"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
