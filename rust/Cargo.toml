[package]
name = "premove-itn-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic realization core for premove-itn"
repository = "https://github.com/premove-ai/premove-itn"
publish = false

[lib]
name = "_rust"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.29.2"
text-processing-rs = {
  git = "https://github.com/FluidInference/text-processing-rs",
  tag = "v0.3.0",
}

[dev-dependencies]
serde_json = "1.0"

[features]
extension-module = ["pyo3/extension-module"]
