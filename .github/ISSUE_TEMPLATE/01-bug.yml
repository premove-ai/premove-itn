name: Bug report
description: Report reproducible incorrect behavior in premove-itn.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include private transcripts, credentials, personal data, or customer data.

  - type: checkboxes
    id: existing
    attributes:
      label: Existing issue
      options:
        - label: I searched the existing issues for this problem.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide a minimal, de-identified example and exact commands.
      placeholder: |
        Input:
        Expected:
        Actual:
        Commands:
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Normalization result
        - Model loading or device
        - Python API
        - Command-line interface
        - Installation or packaging
        - Documentation or benchmark
        - Other
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or package version where the problem occurs.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, architecture, Python version, and installation command.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: The report contains no private or identifying transcript data.
          required: true
