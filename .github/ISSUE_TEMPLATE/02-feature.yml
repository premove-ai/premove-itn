name: Feature proposal
description: Propose a focused change to Premove ITN.
title: "[Proposal]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: existing
    attributes:
      label: Existing proposal
      options:
        - label: I searched the existing issues for this proposal.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem needs to be solved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest change that solves the problem.
    validations:
      required: true

  - type: textarea
    id: fit
    attributes:
      label: Why this belongs in Premove ITN
      description: Explain how the proposal fits the current product and architecture boundaries.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and success measure
      description: Explain how the change will be tested and what result means it works.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Runtime and model impact
      description: State whether this changes candidates, scoring, decoding, model artifacts, latency, or dependencies.

  - type: checkboxes
    id: privacy
    attributes:
      label: Data and privacy
      options:
        - label: This proposal includes no private transcripts, customer data, credentials, model weights, or training data.
          required: true
