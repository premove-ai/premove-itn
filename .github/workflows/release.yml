name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v0.2.0"]

permissions:
  contents: read

jobs:
  wheel:
    name: Build ${{ matrix.os }} cp${{ matrix.py }} wheel
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos, runner: macos-14, py: "311", python: "3.11" }
          - { os: macos, runner: macos-14, py: "312", python: "3.12" }
          - { os: macos, runner: macos-14, py: "313", python: "3.13" }
          - { os: linux, runner: ubuntu-22.04, py: "311", python: "3.11" }
          - { os: linux, runner: ubuntu-22.04, py: "312", python: "3.12" }
          - { os: linux, runner: ubuntu-22.04, py: "313", python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
      - name: Build macOS wheel
        if: matrix.os == 'macos'
        run: uv build --wheel --python ${{ matrix.python }} --out-dir dist
      - name: Build manylinux wheel
        if: matrix.os == 'linux'
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          command: build
          maturin-version: v1.11.5
          target: x86_64-unknown-linux-gnu
          manylinux: 2_28
          args: --release --locked --compatibility pypi --interpreter python${{ matrix.python }} --out dist
      - name: Inspect wheel
        run: python scripts/inspect_release_artifact.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheel-${{ matrix.os }}-cp${{ matrix.py }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv build --sdist --out-dir dist
      - run: python scripts/inspect_release_artifact.py dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  verify:
    name: Verify exact release set
    needs: [wheel, sdist]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - run: python scripts/inspect_release_artifact.py dist/*
      - name: Generate release manifest
        run: >-
          python scripts/generate_release_manifest.py
          --dist dist
          --version 0.2.0
          --git-commit "$GITHUB_SHA"
          --model-sha256 0b6f36aa32311d0c495e1c5307d5e34463e52b4dc283ab9030bc2f54e1bf1152
          --output release-manifest-v0.2.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: |
            dist/*
            release-manifest-v0.2.0.json
          if-no-files-found: error

  release-candidate-inference:
    name: Verify release candidate inference
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release
          path: release
      - name: Install the verified manylinux wheel
        run: |
          pip install --only-binary :all: \
            release/dist/*cp311*manylinux_2_28_x86_64.whl
      - name: Verify the immutable Hub tag
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi
          from premove_itn.contextual import (
              DEFAULT_MODEL_ID,
              DEFAULT_RELEASE,
              DEFAULT_REVISION,
          )

          resolved = HfApi().model_info(
              DEFAULT_MODEL_ID,
              revision=DEFAULT_RELEASE,
          ).sha
          if resolved != DEFAULT_REVISION:
              raise SystemExit(
                  f"{DEFAULT_MODEL_ID}@{DEFAULT_RELEASE} resolved to "
                  f"{resolved}, expected {DEFAULT_REVISION}"
              )
          print(f"verified {DEFAULT_MODEL_ID}@{DEFAULT_RELEASE} -> {resolved}")
          PY
      - name: Verify release inference
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from premove_itn import PremoveITN

          itn = PremoveITN.from_pretrained(device="cpu")
          cases = {
              "meet me at two thirty": "meet me at 02:30",
              "room two thirty": "room 230",
              "flight seven forty two leaves at seven forty two":
                  "flight 742 leaves at 07:42",
              "the total is twenty dollars": "the total is $20",
              "visit example dot com": "visit example.com",
              "this is my twenty first call": "this is my 21st call",
          }
          for source, expected in cases.items():
              actual = itn.normalize(source)
              if actual != expected:
                  raise SystemExit(f"{source!r}: got {actual!r}, expected {expected!r}")
          PY

  draft-github-release:
    name: Stage GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.2.0'
    needs: release-candidate-inference
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release
          path: release
      - name: Create draft with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/dist/*
          release/release-manifest-v0.2.0.json
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --draft

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.2.0'
    needs: draft-github-release
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/premove-itn
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release
          path: release
      - name: Keep only distributions in upload directory
        run: |
          mkdir dist
          mv release/dist/* dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          print-hash: true

  public-install:
    name: Public install on ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.2.0'
    needs: publish-pypi
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      matrix:
        include:
          - { os: Linux, runner: ubuntu-22.04 }
          - { os: macOS, runner: macos-14 }
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only the public binary wheel
        run: |
          pip install --no-cache-dir --only-binary :all: \
            premove-itn==0.2.0
      - name: Verify public CLI and package
        run: |
          premove-itn --version
          premove-itn --help >/dev/null
          python -c "import premove_itn; print(premove_itn.__file__)"
      - name: Verify public Linux inference
        if: matrix.os == 'Linux'
        run: python -c "from premove_itn import PremoveITN; assert PremoveITN.from_pretrained(device='cpu').normalize('call me at four thirty') == 'call me at 04:30'"

  github-release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.2.0'
    needs: public-install
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish the staged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
