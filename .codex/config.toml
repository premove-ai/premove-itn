model = "gpt-6-sol"
model_reasoning_effort = "medium"

[mcp_servers.codegraph]
command = "uv"
args = ["run", "--no-project", "python", "scripts/agent/codegraph_mcp.py"]

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "medium"

[agents.explorer]
description = "Investigate bounded unresolved code questions and report evidence."
config_file = "./agents/explorer.toml"

[agents.reviewer]
description = "Review implementation against the accepted plan and invariants."
config_file = "./agents/reviewer.toml"

[agents.architect]
description = "Resolve unanswered architecture decisions or concrete invariant conflicts."
config_file = "./agents/architect.toml"
