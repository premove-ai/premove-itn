model = "gpt-6-sol"
model_reasoning_effort = "medium"

[mcp_servers.codegraph]
command = "uv"
args = ["run", "--no-project", "python", "scripts/agent/codegraph_mcp.py"]

[agents]
enabled = true
max_concurrent_threads_per_session = 2

[agents.explorer]
description = "Investigate independent or large isolated code questions and return compact evidence."
config_file = "./agents/explorer.toml"

[agents.reviewer]
description = "Independently review a provided change for concrete invariant violations."
config_file = "./agents/reviewer.toml"

[agents.architect]
description = "Resolve unanswered architecture decisions or concrete invariant conflicts."
config_file = "./agents/architect.toml"
